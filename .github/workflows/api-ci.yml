name: ci

on:
  pull_request:
  push:
    branches: [main, 'batch/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Job-local throwaway value for the service container; not a secret.
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/core
      DIRECT_URL: postgresql://postgres:dev@localhost:5432/core
      # Literal placeholders, not secrets: no job touches Clerk or Cloudinary.
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_JWT_KEY: ci-placeholder-jwt-key
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # oven-sh/setup-bun v2.2.0 (version read from packageManager)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      # actions/setup-node v7.1.0 (version read from .nvmrc)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:cov
      - name: Apply migrations and seed on the fresh service database
        run: |
          bunx prisma migrate deploy
          bun run db:seed
      - run: bun run test:int
      - run: bun run test:e2e
      - run: bun run openapi:check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Build only: no push, no registry login.
      - run: docker build -t core-api:ci .
