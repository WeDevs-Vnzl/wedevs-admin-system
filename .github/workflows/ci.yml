name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

# The Next.js app lives in fe/; every `run` step executes there.
defaults:
  run:
    working-directory: fe

jobs:
  verify:
    name: Lint, types, tests, i18n, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node runs Next.js, Vitest and Playwright; bun only installs and runs the package scripts.
      - uses: actions/setup-node@v4
        with:
          node-version-file: fe/.nvmrc

      # Reads the bun version from `packageManager`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: fe/package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('fe/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run i18n:check
      - run: bun run build

  e2e:
    name: E2E (Hito 1, mocks, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "3000"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # Node runs Next.js, Vitest and Playwright; bun only installs and runs the package scripts.
      - uses: actions/setup-node@v4
        with:
          node-version-file: fe/.nvmrc

      # Reads the bun version from `packageManager`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: fe/package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('fe/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - run: bun run build

      - name: Start app, run E2E, stop app
        run: |
          bun run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null "$PLAYWRIGHT_BASE_URL"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Server did not become ready within 60 s"
            cat "$RUNNER_TEMP/next-start.log"
            exit 1
          fi

          bun run test:e2e --pass-with-no-tests

      - name: Stop app (safety net)
        if: always()
        run: pkill -f "next start" || pkill -f "next-server" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: fe/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
