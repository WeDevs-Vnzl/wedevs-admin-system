name: CI

# One workflow for the monorepo (DT-115). Each job runs only when Turborepo reports its package as affected:
# pull requests compare against the base branch, pushes against the previous tip (`turbo ls --affected`
# reads both from the GitHub Actions environment). A change to this file affects every package (turbo.json
# globalDependencies); turbo maps bun.lock changes to the packages whose dependencies changed.
on:
  pull_request:
  push:
    branches: [main, 'batch/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: api (lint, types, tests, migrations, int, e2e, openapi)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No Postgres service: test:int and test:e2e start their own postgres:17 with Testcontainers on the runner's
    # Docker, migrating and seeding a template database that every spec file clones (DT-117).
    env:
      # Literal placeholders, not secrets: no job touches Clerk or Cloudinary.
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_JWT_KEY: ci-placeholder-jwt-key
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
    defaults:
      run:
        working-directory: apps/api
    steps:
      # actions/checkout v7.0.1; full history so turbo can diff against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # oven-sh/setup-bun v2.2.0 (version read from packageManager)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      # actions/setup-node v7.1.0 (version read from .nvmrc)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: .
      # The api also owns the contract it writes (packages/api-contract).
      - name: Check whether the api is affected
        id: affected
        working-directory: .
        # Explicit bash adds pipefail: a failing `turbo ls` must fail the job, not skip every check.
        shell: bash
        run: |
          affected=$(bunx turbo ls --affected --output json | jq '[.packages.items[].name] | any(. == "@wedevs/api" or . == "@wedevs/api-contract")')
          case "$affected" in
            true|false) ;;
            *) echo "::error::turbo ls --affected returned '$affected'"; exit 1 ;;
          esac
          echo "run=$affected" >> "$GITHUB_OUTPUT"
          echo "api affected: $affected" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.affected.outputs.run == 'true'
        run: bun run prisma:generate
      - if: steps.affected.outputs.run == 'true'
        run: bun run lint
      - if: steps.affected.outputs.run == 'true'
        run: bun run typecheck
      - if: steps.affected.outputs.run == 'true'
        run: bun run test:cov
      # Also proves every migration and the seed apply to an empty database (global setup's template).
      - if: steps.affected.outputs.run == 'true'
        run: bun run test:int
      - if: steps.affected.outputs.run == 'true'
        run: bun run test:e2e
      - if: steps.affected.outputs.run == 'true'
        run: bun run openapi:check
      # Build only: no push, no registry login. Build context is the repository root (compose.yaml).
      - name: Build the api image
        if: steps.affected.outputs.run == 'true'
        working-directory: .
        run: docker build -f apps/api/Dockerfile -t wedevs-api:ci .

  web:
    name: web (lint, types, tests, api, i18n, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The unauthenticated E2E runs against a real local BE (FE-INT-0 A2): its Postgres is this service; the BE is
    # built and started from apps/api in the E2E step.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: "3000"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Inlined into the browser bundle at build time; the BE listens on API_PORT.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      API_PORT: "3001"
      # The Clerk dev publishable key is not a secret (it ships in the bundle): a repository variable (DT-214).
      # Without it every FE route answers 500. The dev secret key is a repository secret, read only by the E2E step.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/core
      DIRECT_URL: postgresql://postgres:dev@localhost:5432/core
    defaults:
      run:
        working-directory: apps/web
    steps:
      # actions/checkout v7.0.1; full history so turbo can diff against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # oven-sh/setup-bun v2.2.0 (version read from packageManager)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      # actions/setup-node v7.1.0 (version read from .nvmrc); Node runs Next.js, Vitest and Playwright.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: .
      # Affected also covers contract changes: the web depends on @wedevs/api-contract.
      - name: Check whether the web is affected
        id: affected
        working-directory: .
        # Explicit bash adds pipefail: a failing `turbo ls` must fail the job, not skip every check.
        shell: bash
        run: |
          affected=$(bunx turbo ls --affected --output json | jq '[.packages.items[].name] | any(. == "@wedevs/web")')
          case "$affected" in
            true|false) ;;
            *) echo "::error::turbo ls --affected returned '$affected'"; exit 1 ;;
          esac
          echo "run=$affected" >> "$GITHUB_OUTPUT"
          echo "web affected: $affected" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.affected.outputs.run == 'true'
        run: bun run lint
      - if: steps.affected.outputs.run == 'true'
        run: bun run typecheck
      - if: steps.affected.outputs.run == 'true'
        run: bun run test:coverage
      - if: steps.affected.outputs.run == 'true'
        run: bun run api:check
      - if: steps.affected.outputs.run == 'true'
        run: bun run i18n:check
      - name: Require the Clerk dev keys
        if: steps.affected.outputs.run == 'true'
        env:
          HAS_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY != '' }}
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set (DT-214)"
            exit 1
          fi
          if [ "$HAS_CLERK_SECRET_KEY" != "true" ]; then
            echo "::error::Repository secret CLERK_SECRET_KEY (Clerk dev instance) is not set (DT-214)"
            exit 1
          fi
      - if: steps.affected.outputs.run == 'true'
        run: bun run build

      # Migrations and the seed on the service database, then the production build of the BE.
      - name: Prepare the local BE
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/api
        run: |
          bun run prisma:generate
          bunx prisma migrate deploy
          bun run db:seed
          bun run build

      - name: Install Playwright Chromium
        if: steps.affected.outputs.run == 'true'
        run: bun x playwright install --with-deps chromium

      - name: Start BE and app, run E2E, stop both
        if: steps.affected.outputs.run == 'true'
        env:
          # The Clerk dev secret key (repository secret, DT-214): the Next server's clerkMiddleware verifies the
          # dev-instance handshake a real browser triggers with it. The BE reads the same name.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Literal placeholders, not secrets: the unauthenticated E2E never reaches the BE's Clerk or Cloudinary
          # calls. Svix decodes the webhook secret at boot, so its placeholder is valid base64.
          CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_JWT_KEY: ci-placeholder-jwt-key
          CLERK_WEBHOOK_SECRET: whsec_Y2ktcGxhY2Vob2xkZXItd2ViaG9vay1zZWNyZXQ=
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          SHARE_IP_SALT: ci-placeholder-share-ip-salt-0123456789
          SHARE_UNLOCK_SECRET: ci-placeholder-share-unlock-secret-0123456789
          APP_URL: http://localhost:3000
        run: |
          wait_for() {
            local name="$1" url="$2" pid="$3" log="$4"
            for _ in $(seq 1 60); do
              if curl --silent --fail --output /dev/null "$url"; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            echo "::error::$name did not become ready within 60 s"
            cat "$log"
            exit 1
          }

          (cd ../api && NODE_ENV=production PORT="$API_PORT" node dist/main.js) > "$RUNNER_TEMP/api-start.log" 2>&1 &
          api_pid=$!
          bun run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$api_pid" 2>/dev/null || true' EXIT

          wait_for BE "$NEXT_PUBLIC_API_BASE_URL/api/v1/health" "$api_pid" "$RUNNER_TEMP/api-start.log"
          wait_for App "$PLAYWRIGHT_BASE_URL/sign-in" "$server_pid" "$RUNNER_TEMP/next-start.log"

          # Only the unauthenticated project: the authenticated one needs Clerk test users and the secret key,
          # and stays user-run (DT-204). The legacy mock-backed specs need a session since FE-INT-0.
          # The secret key above is for the BE and the Next server; Playwright runs without it, so the global setup
          # skips the Clerk testing-token call the unauthenticated project does not need.
          env -u CLERK_SECRET_KEY bun x playwright test --project=unauthenticated

      - name: Stop BE and app (safety net)
        if: always()
        run: |
          pkill -f "next start" || pkill -f "next-server" || true
          pkill -f "node dist/main.js" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
