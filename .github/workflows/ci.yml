name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, tests, i18n, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager`; must run before setup-node so `cache: pnpm` finds pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm i18n:check
      - run: pnpm build

  e2e:
    name: E2E (Hito 1, mocks, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "3000"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager`; must run before setup-node so `cache: pnpm` finds pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - name: Start app, run E2E, stop app
        run: |
          pnpm start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null "$PLAYWRIGHT_BASE_URL"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Server did not become ready within 60 s"
            cat "$RUNNER_TEMP/next-start.log"
            exit 1
          fi

          pnpm test:e2e --pass-with-no-tests

      - name: Stop app (safety net)
        if: always()
        run: pkill -f "next start" || pkill -f "next-server" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
